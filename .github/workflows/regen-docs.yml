name: Sync getting-started docs from notebook

# Whenever GettingStarted.ipynb changes on main, copy its current (already
# rendered) outputs into README.md and getting-started/*.png, and commit the
# result back to main. This does NOT re-execute the notebook -- it only
# reflects whatever state you last saved it in, so this step stays fast.
#
# Pushes made with the default GITHUB_TOKEN don't trigger new workflow runs,
# so the commit this job makes won't cause an infinite loop.
on:
  push:
    branches: [main]
    paths:
      - GettingStarted.ipynb

permissions:
  contents: write

jobs:
  regen-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install nbformat

      - name: Sync README and images from the notebook
        run: python scripts/build_getting_started.py --no-execute

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md getting-started/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: sync getting-started assets from notebook"
            git push origin HEAD:main
          fi
